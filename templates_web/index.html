<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>news.lan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }
  .app-shell { display: flex; flex-direction: column; height: 100vh; }
  .topbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #ddd; background: #fff; }
  .topbar-title { font-size: 14px; color: #111; font-weight: 600; }
  .view-switch { display: inline-flex; border: 1px solid #d9d9d9; border-radius: 6px; overflow: hidden; }
  .view-switch button { min-width: 72px; border: none; background: #fff; padding: 6px 12px; font-size: 13px; color: #666; cursor: pointer; }
  .view-switch button + button { border-left: 1px solid #d9d9d9; }
  .view-switch button.active { background: #1a6feb; color: #fff; }
  #app { display: flex; flex: 1; min-height: 0; }
  .panel { overflow-y: auto; }
  .panel-left { width: 220px; flex-shrink: 0; border-right: 1px solid #ddd; background: #fff; }
  .panel-center { width: 320px; flex-shrink: 0; border-right: 1px solid #ddd; background: #fff; display: flex; flex-direction: column; }
  .panel-right { flex: 1; background: #fff; }
  .summary-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .summary-actions { display: inline-flex; gap: 8px; margin-left: 8px; vertical-align: middle; }
  .summary-actions button { border: 1px solid #ddd; background: #fff; padding: 1px 6px; border-radius: 3px; cursor: pointer; font-size: 11px; color: #1a6feb; }
  .summary-actions button:hover { background: #f0f5ff; border-color: #1a6feb; }
  .summary-actions button:disabled { color: #aaa; background: #f5f5f5; border-color: #ddd; cursor: default; }
  .summary-status { font-size: 11px; color: #999; margin-left: 8px; }

  .panel-left h3 { padding: 12px 16px; font-size: 14px; color: #666; border-bottom: 1px solid #eee; }
  .acct-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 14px; transition: background .15s; }
  .acct-item:hover { background: #f0f5ff; }
  .acct-item.active { background: #e6f0ff; font-weight: 600; color: #1a6feb; }

  .panel-center h4 { padding: 12px 16px; font-size: 13px; color: #666; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  #article-scroll { flex: 1; overflow-y: auto; }
  .art-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background .15s; }
  .art-item:hover { background: #f0f5ff; }
  .art-item.active { background: #e6f0ff; }
  .art-times { font-size: 11px; color: #999; margin-bottom: 3px; }
  .art-times span { margin-right: 12px; }
  .art-title { font-size: 14px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .art-meta { font-size: 12px; color: #999; display: flex; gap: 8px; }
  .art-meta .badge { color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px; }
  .badge-ok { background: #52c41a; }
  .badge-pending { background: #1a6feb; }
  .badge-failed { background: #faad14; }
  .badge-give-up { background: #d4380d; }
  .retry-btn { border: 1px solid #ddd; background: #fff; color: #1a6feb; font-size: 11px; padding: 1px 6px; border-radius: 3px; cursor: pointer; }
  .retry-btn:hover { border-color: #1a6feb; background: #f0f5ff; }
  .retry-btn:disabled { color: #aaa; cursor: default; background: #f5f5f5; border-color: #ddd; }

  #pager { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-top: 1px solid #eee; font-size: 13px; }
  #pager button { border: 1px solid #ddd; background: #fff; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  #pager button:hover { background: #e6f0ff; border-color: #1a6feb; }
  #pager button:disabled { color: #ccc; cursor: default; background: #f5f5f5; }
  #pager span { color: #666; }

  .panel-right { flex: 1; background: #fff; display: flex; flex-direction: column; }
  .article-url-bar { flex-shrink: 0; padding: 6px 16px; background: #fafafa; border-bottom: 1px solid #eee; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .article-url-bar a { color: #1a6feb; text-decoration: none; }
  .article-url-bar a:hover { text-decoration: underline; }
  .article-content-wrap { flex: 1; position: relative; }
  .article-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #bbb; font-size: 16px; flex-direction: column; gap: 8px; }
  .article-empty small { font-size: 13px; }
  .article-empty a { color: #1a6feb; }
  .article-frame { width: 100%; height: 100%; border: none; }

  .loading { padding: 24px; text-align: center; color: #999; }
  .acct-badge { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #eee; color: #666; margin-left: 6px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-title">news.lan</div>
    <div class="view-switch">
      <button id="tab-wechat" class="active" type="button" onclick="switchView('wechat')">公众号</button>
      <button id="tab-zhihu" type="button" onclick="switchView('zhihu')">知乎</button>
    </div>
  </div>
<div id="app">
  <div class="panel panel-left">
    <h3 id="left-title">公众号 <a href="/llm.txt" style="font-size:11px;font-weight:normal;color:#1a6feb;float:right">llm.txt</a></h3>
    <div id="stats-bar" style="padding:6px 16px;font-size:11px;color:#999;border-bottom:1px solid #eee;line-height:1.6">加载中...</div>
    <div id="account-list"><div class="loading">加载中...</div></div>
  </div>
  <div class="panel panel-center">
    <h4 id="center-title">文章列表</h4>
    <div id="article-scroll">
      <div id="article-list"><div class="loading">请选择公众号</div></div>
    </div>
    <div id="pager"></div>
  </div>
  <div class="panel panel-right">
    <div id="article-url-bar" class="article-url-bar" style="display:none"></div>
    <div class="article-content-wrap">
      <div id="article-view" class="article-empty">选择文章查看内容</div>
    </div>
  </div>
</div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const PAGE_SIZE = 30;
let currentView = 'wechat';
let accounts = [], loadedArticles = [], selectedAccountId = null, selectedArticleId = null,
    currentPage = 0, totalArticles = 0;
const articleCache = new Map();
let zhihuFollowings = [];
let zhihuTodayItems = [];
let zhihuCurrentSlug = null;
let zhihuSelectedFollowingIdx = null;
let zhihuSelectedItemIdx = null;
let zhihuTodayRequestSeq = 0;
let zhihuRefreshInFlight = false;
let zhihuFollowingRefreshInFlight = false;
let zhihuCheckInFlight = false;
let zhihuFollowingStatusTimer = null;

function h(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function hAttr(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function normalizeZhihuContentHtml(html) {
  if (!html) return '';
  const root = document.createElement('div');
  root.innerHTML = html;

  root.querySelectorAll('img').forEach((img) => {
    const actualSrc = img.getAttribute('data-actualsrc') || img.getAttribute('data-original') || img.getAttribute('src');
    if (actualSrc) img.setAttribute('src', actualSrc);
    img.removeAttribute('srcset');
    img.style.maxWidth = '100%';
    img.style.height = 'auto';
    img.style.display = 'block';
    img.style.margin = '12px auto';
  });

  root.querySelectorAll('noscript').forEach((node) => {
    const parent = node.parentElement;
    const siblingImg = parent
      ? Array.from(parent.querySelectorAll('img')).find((img) => !node.contains(img))
      : null;
    if (siblingImg) {
      node.remove();
      return;
    }
    const wrapper = document.createElement('div');
    wrapper.innerHTML = node.textContent || '';
    const img = wrapper.querySelector('img');
    if (!img) {
      node.remove();
      return;
    }
    const actualSrc = img.getAttribute('data-original') || img.getAttribute('src');
    if (actualSrc) img.setAttribute('src', actualSrc);
    img.style.maxWidth = '100%';
    img.style.height = 'auto';
    img.style.display = 'block';
    img.style.margin = '12px auto';
    node.replaceWith(img);
  });

  root.querySelectorAll('figure').forEach((figure) => {
    figure.style.margin = '16px 0';
  });

  root.querySelectorAll('figcaption').forEach((caption) => {
    caption.style.color = '#666';
    caption.style.fontSize = '12px';
    caption.style.marginTop = '6px';
  });

  return root.innerHTML;
}

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function zhihuCheckStatusText(task) {
  if (!task) return '-';
  if (task.status === 'running') return '进行中';
  if (task.status === 'done') return '成功';
  if (task.status === 'failed') return task.error ? `失败: ${task.error}` : '失败';
  if (task.status === 'pending') return '排队中';
  return task.status || '-';
}

function switchView(view) {
  currentView = view;
  $('#tab-wechat').classList.toggle('active', view === 'wechat');
  $('#tab-zhihu').classList.toggle('active', view === 'zhihu');

  if (view === 'wechat') {
    $('#left-title').innerHTML = '公众号 <a href="/llm.txt" style="font-size:11px;font-weight:normal;color:#1a6feb;float:right">llm.txt</a>';
    $('#stats-bar').textContent = '加载中...';
    $('#account-list').innerHTML = '<div class="loading">加载中...</div>';
    $('#center-title').textContent = '文章列表';
    $('#article-list').innerHTML = '<div class="loading">请选择公众号</div>';
    $('#article-view').textContent = '选择文章查看内容';
    loadStats();
    loadAccounts();
    return;
  }

  $('#left-title').innerHTML = '知乎 <a href="/zhihu.txt" style="font-size:11px;font-weight:normal;color:#1a6feb;float:right">zhihu.txt</a>';
  zhihuCurrentSlug = null;
  zhihuSelectedFollowingIdx = null;
  zhihuSelectedItemIdx = null;
  $('#stats-bar').innerHTML = `
    共 <strong id="zh-total-following">-</strong> 个知乎关注
    <span class="summary-actions"><button id="zhihu-refresh-following-btn" type="button" onclick="refreshZhihuFollowing()">刷新关注</button></span><span id="zhihu-refresh-following-status" class="summary-status"></span><br>
    回答作者 <strong id="zh-answer-authors">-</strong> 个<br>
    已收录内容 <strong id="zh-total-contents">-</strong> 条<br>
    今日新增 <strong id="zh-today-new">-</strong> 条
    <span class="summary-actions"><button id="zhihu-check-new-btn" type="button" onclick="checkZhihuNew()">检查新内容</button></span><span id="zhihu-check-new-status" class="summary-status"></span><br>
    <span style="font-size:10px">上次检查 <span id="zh-last-check">-</span></span>`;
  $('#account-list').innerHTML = '<div class="loading">知乎关注列表稍后接入</div>';
  $('#center-title').textContent = '知乎今日更新';
  $('#article-list').innerHTML = '<div class="loading">请选择左侧知乎账号</div>';
  $('#pager').innerHTML = '';
  $('#article-url-bar').style.display = 'none';
  $('#article-view').innerHTML = '<div class="article-empty">请选择左侧知乎账号<br><small>点击后可直接查看今日更新</small></div>';
  loadZhihuStats();
}

async function loadZhihuStats() {
  if (currentView !== 'zhihu') return;
  const resp = await fetch('/api/zhihu/stats');
  const s = await resp.json();
  $('#zh-total-following').textContent = s.total_following;
  $('#zh-answer-authors').textContent = s.answer_authors;
  $('#zh-total-contents').textContent = s.total_contents;
  $('#zh-today-new').textContent = s.today_new;
  $('#zh-last-check').textContent = s.last_check_task
    ? `${fmtTime(s.last_check)} (${zhihuCheckStatusText(s.last_check_task)})`
    : fmtTime(s.last_check);
  await loadZhihuFollowings();
  await loadZhihuToday();
}

async function loadZhihuToday() {
  if (currentView !== 'zhihu') return;
  if (!zhihuCurrentSlug) {
    zhihuTodayItems = [];
    zhihuSelectedItemIdx = null;
    $('#article-list').innerHTML = '<div class="loading">请选择左侧知乎账号</div>';
    return;
  }
  const requestedSlug = zhihuCurrentSlug;
  const requestSeq = ++zhihuTodayRequestSeq;
  const url = `/api/zhihu/following-contents?slug=${encodeURIComponent(requestedSlug)}`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (currentView !== 'zhihu' || requestSeq !== zhihuTodayRequestSeq || requestedSlug !== zhihuCurrentSlug) return;
  zhihuTodayItems = Array.isArray(data.items) ? data.items : [];
  if (!zhihuTodayItems[zhihuSelectedItemIdx ?? -1]) zhihuSelectedItemIdx = null;
  $('#article-list').innerHTML = zhihuTodayItems.length
    ? zhihuTodayItems.map((item, idx) => `
      <div class="art-item ${zhihuSelectedItemIdx === idx ? 'active' : ''}" data-zh-idx="${idx}" onclick="selectZhihuItem(${idx})">
        <div class="art-times">
          <span>发布 ${fmtTime(item.publish_time_iso)}</span>
          <span>更新 ${fmtTime(item.updated_time_iso)}</span>
        </div>
        <div class="art-title">${h(item.title || '未命名')}</div>
        <div class="art-meta"><span>${h(item.author_name || '')}</span><span>${h(item.content_type || '')}</span></div>
      </div>
    `).join('')
    : '<div class="loading">今天还没有新增</div>';
  if (zhihuTodayItems.length && zhihuSelectedItemIdx !== null) selectZhihuItem(zhihuSelectedItemIdx);
  else if (zhihuTodayItems.length) selectZhihuItem(0);
  else {
    $('#article-url-bar').style.display = 'none';
    $('#article-view').innerHTML = '<div class="article-empty">今天还没有新增</div>';
  }
}

async function loadZhihuFollowings() {
  const resp = await fetch('/api/zhihu/following');
  zhihuFollowings = await resp.json();
  zhihuSelectedFollowingIdx = zhihuFollowings.findIndex(item => item.slug === zhihuCurrentSlug);
  $('#account-list').innerHTML = zhihuFollowings.length
    ? zhihuFollowings.map((item, idx) => `
      <div class="acct-item ${idx === zhihuSelectedFollowingIdx ? 'active' : ''}" data-zh-idx="${idx}" onclick="selectZhihuFollowing(${idx})">
        ${h(item.name)}
      </div>
    `).join('')
    : '<div class="loading">暂无关注</div>';
}

function currentZhihuProfileUrl() {
  const current = zhihuFollowings.find((item) => item.slug === zhihuCurrentSlug);
  return current ? (current.profile_url || '') : '';
}

function setZhihuCenterTitle(name, statusText = '') {
  const profileUrl = currentZhihuProfileUrl();
  const titleHtml = profileUrl
    ? `<a href="${hAttr(profileUrl)}" target="_blank" rel="noopener noreferrer" style="color:#1a6feb;text-decoration:none">${h(name)}</a>`
    : h(name);
  $('#center-title').innerHTML = `${titleHtml} <span class="summary-actions"><button id="zhihu-refresh-today-btn" type="button" onclick="refreshZhihuToday()">抓今日更新</button></span><span id="zhihu-refresh-status" class="summary-status">${h(statusText)}</span>`;
}

function setZhihuRefreshStatus(statusText = '') {
  const statusEl = $('#zhihu-refresh-status');
  if (statusEl) statusEl.textContent = statusText;
}

function selectZhihuFollowing(idx) {
  if (currentView !== 'zhihu') return;
  const item = zhihuFollowings[idx];
  if (!item) return;
  zhihuSelectedFollowingIdx = idx;
  zhihuSelectedItemIdx = null;
  zhihuCurrentSlug = item.slug;
  $$('.acct-item').forEach(el => el.classList.toggle('active', +el.dataset.zhIdx === idx));
  setZhihuCenterTitle(item.name);
  $('#article-list').innerHTML = '<div class="loading">加载中...</div>';
  $('#article-view').innerHTML = '<div class="article-empty">抓取中...</div>';
  loadZhihuToday();
}

function selectZhihuItem(idx) {
  if (currentView !== 'zhihu') return;
  const item = zhihuTodayItems[idx];
  if (!item) return;
  zhihuSelectedItemIdx = idx;
  $$('.art-item').forEach(el => el.classList.toggle('active', +el.dataset.zhIdx === idx));
  $('#article-url-bar').style.display = 'block';
  $('#article-url-bar').innerHTML = `<a href="${hAttr(item.url)}" target="_blank" rel="noopener noreferrer">${h(item.url)}</a>`;
  const title = item.title || '未命名';
  const publishTime = fmtTime(item.publish_time_iso);
  const updatedTime = fmtTime(item.updated_time_iso);
  const contentHtml = normalizeZhihuContentHtml(item.content_html || '');
  const safeText = h(item.content_text || '');
  $('#article-view').innerHTML = `
    <div style="padding:20px;max-width:860px;line-height:1.8;color:#222">
      <div style="font-size:12px;color:#999;margin-bottom:8px">${h(item.content_type || '')} · ${h(item.author_name || '')}</div>
      <h2 style="font-size:22px;line-height:1.4;margin-bottom:12px">${h(title)}</h2>
      <div style="font-size:12px;color:#999;margin-bottom:18px">发布 ${h(publishTime)} · 更新 ${h(updatedTime)}</div>
      <div style="font-size:15px;line-height:1.9;word-break:break-word">${contentHtml || `<div style="white-space:pre-wrap">${safeText}</div>`}</div>
    </div>
  `;
}

async function refreshZhihuToday() {
  if (!zhihuCurrentSlug || zhihuRefreshInFlight) return;
  const requestedSlug = zhihuCurrentSlug;
  zhihuRefreshInFlight = true;
  setZhihuRefreshStatus('抓取中...');
  const refreshBtn = $('#zhihu-refresh-today-btn');
  if (refreshBtn) refreshBtn.disabled = true;
  try {
    const resp = await fetch(`/api/zhihu/following-refresh?slug=${encodeURIComponent(requestedSlug)}`, { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.detail || '抓取失败');
    }
    if (requestedSlug !== zhihuCurrentSlug) return;
    await loadZhihuToday();
    if (requestedSlug !== zhihuCurrentSlug) return;
    const itemCount = typeof data.new_items_count === 'number' ? data.new_items_count : 0;
    setZhihuRefreshStatus(itemCount ? `本次新增 ${itemCount} 条` : '无新增');
  } catch (error) {
    if (requestedSlug === zhihuCurrentSlug) setZhihuRefreshStatus('抓取失败');
    console.error('zhihu today refresh failed', error);
  } finally {
    zhihuRefreshInFlight = false;
    if (refreshBtn) refreshBtn.disabled = false;
  }
}

async function refreshZhihuFollowing() {
  if (zhihuFollowingRefreshInFlight) return;
  zhihuFollowingRefreshInFlight = true;
  const refreshBtn = $('#zhihu-refresh-following-btn');
  const statusEl = $('#zhihu-refresh-following-status');
  if (zhihuFollowingStatusTimer !== null) {
    clearTimeout(zhihuFollowingStatusTimer);
    zhihuFollowingStatusTimer = null;
  }
  if (refreshBtn) refreshBtn.disabled = true;
  if (statusEl) statusEl.textContent = '刷新中...';
  try {
    const resp = await fetch('/api/zhihu/refresh-following', { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.detail || '刷新失败');
    }
    await loadZhihuStats();
    const added = typeof data.added_count === 'number' ? data.added_count : 0;
    const removed = typeof data.removed_count === 'number' ? data.removed_count : 0;
    const total = typeof data.following_count === 'number' ? data.following_count : 0;
    if (statusEl) {
      statusEl.textContent = `刷新完成：当前 ${total}，新增 ${added}，取消 ${removed}`;
      zhihuFollowingStatusTimer = setTimeout(() => {
        statusEl.textContent = '';
        zhihuFollowingStatusTimer = null;
      }, 15_000);
    }
  } catch (error) {
    if (statusEl) {
      statusEl.textContent = '刷新失败';
      zhihuFollowingStatusTimer = setTimeout(() => {
        statusEl.textContent = '';
        zhihuFollowingStatusTimer = null;
      }, 15_000);
    }
    console.error('zhihu refresh following failed', error);
  } finally {
    zhihuFollowingRefreshInFlight = false;
    if (refreshBtn) refreshBtn.disabled = false;
  }
}

async function checkZhihuNew() {
  if (zhihuCheckInFlight) return;
  zhihuCheckInFlight = true;
  const checkBtn = $('#zhihu-check-new-btn');
  const statusEl = $('#zhihu-check-new-status');
  if (checkBtn) checkBtn.disabled = true;
  if (statusEl) statusEl.textContent = '检查中...';
  try {
    const resp = await fetch('/api/zhihu/check-new', { method: 'POST' });
    const data = await resp.json();
    console.log('zhihu check finished', data);
    if (!resp.ok) {
      throw new Error(data.detail || '检查失败');
    }
    if (statusEl) {
      const itemCount = typeof data.new_items_count === 'number' ? data.new_items_count : 0;
      statusEl.textContent = itemCount ? `本次新增 ${itemCount} 条` : '无新增';
    }
    await loadZhihuStats();
  } catch (error) {
    if (statusEl) statusEl.textContent = '检查失败';
    console.error('zhihu check failed', error);
  } finally {
    zhihuCheckInFlight = false;
    if (checkBtn) checkBtn.disabled = false;
  }
}

async function loadAccounts() {
  if (currentView !== 'wechat') return;
  const resp = await fetch('/api/accounts');
  accounts = await resp.json();
  const el = $('#account-list');
  el.innerHTML = accounts.map(a => `
    <div class="acct-item" data-id="${a.id}" onclick="selectAccount(${a.id})">
      ${h(a.name)}<span class="acct-badge">${h(a.username || a.biz || '')}</span>
    </div>
  `).join('');
}

async function loadStats() {
  if (currentView !== 'wechat') return;
  const resp = await fetch('/api/stats');
  const s = await resp.json();
  $('#stats-bar').innerHTML = `共 ${s.total_accounts} 个公众号<br>${s.total_articles} 篇文章<br>已抓取 ${s.fetched_articles} 篇<br>待抓取 ${s.pending_articles} 篇<br>失败 ${s.failed_articles} 篇<br>已放弃 ${s.give_up_articles} 篇<br><span style="font-size:10px">上次采集 ${fmtTime(s.last_collect_at)}</span>`;
}

async function selectAccount(id) {
  if (currentView !== 'wechat') return;
  selectedAccountId = id;
  selectedArticleId = null;
  loadedArticles = [];
  articleCache.clear();
  currentPage = 0;
  $$('.acct-item').forEach(el => el.classList.toggle('active', +el.dataset.id === id));
  $$('.art-item').forEach(el => el.classList.remove('active'));
  $('#article-view').innerHTML = '<div class="article-empty">选择文章查看内容</div>';
  $('#article-url-bar').style.display = 'none';
  $('#center-title').textContent = accounts.find(a => a.id === id)?.name || '文章列表';
  await loadPage(0);
}

async function loadPage(page) {
  if (currentView !== 'wechat') return;
  currentPage = page;
  const el = $('#article-list');
  el.innerHTML = '<div class="loading">加载中...</div>';
  const offset = page * PAGE_SIZE;
  const resp = await fetch(`/api/article-list?account_id=${selectedAccountId}&limit=${PAGE_SIZE}&offset=${offset}`);
  const data = await resp.json();
  loadedArticles = data.items;
  totalArticles = data.total;
  renderArticleList();
  renderPager();
}

function renderArticleList() {
  const el = $('#article-list');
  el.innerHTML = loadedArticles.map(a => `
    <div class="art-item ${selectedArticleId === a.id ? 'active' : ''}" data-id="${a.id}" onclick="selectArticle(${a.id})">
      <div class="art-times">
        <span>发布 ${fmtTime(a.pub_time)}</span>
        <span>抓取 ${fmtTime(a.first_seen_at)}</span>
      </div>
      <div class="art-title">${h(a.title)}</div>
      ${articleStatusHtml(a)}
    </div>
  `).join('');
}

function fetchStatusText(a) {
  if (a.has_content || a.fetch_status === 'fetched') return '已抓取';
  if (a.fetch_status === 'failed') return '等待重试';
  if (a.fetch_status === 'give_up') return '已放弃';
  return '等待抓取';
}

function fetchStatusClass(a) {
  if (a.fetch_status === 'failed') return 'badge-failed';
  if (a.fetch_status === 'give_up') return 'badge-give-up';
  return 'badge-pending';
}

function articleStatusHtml(a) {
  if (a.has_content) return '';
  const retryText = a.retry_count ? `失败 ${a.retry_count} 次` : '';
  const nextRetry = a.next_retry_at ? `下次 ${fmtTime(a.next_retry_at)}` : '';
  const detail = [retryText, nextRetry].filter(Boolean).join(' / ');
  return `
    <div class="art-meta">
      <span class="badge ${fetchStatusClass(a)}" title="${hAttr(a.fetch_error || '')}">${fetchStatusText(a)}</span>
      ${detail ? `<span>${h(detail)}</span>` : ''}
      <button class="retry-btn" data-retry-id="${a.id}" onclick="retryFetch(event, ${a.id})">加入重试</button>
    </div>
  `;
}

function renderPager() {
  const totalPages = Math.ceil(totalArticles / PAGE_SIZE);
  if (totalPages <= 1) {
    $('#pager').innerHTML = '';
    return;
  }
  $('#pager').innerHTML = `
    <button onclick="loadPage(0)" ${currentPage === 0 ? 'disabled' : ''}>首页</button>
    <button onclick="loadPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>上一页</button>
    <span>${currentPage + 1} / ${totalPages}</span>
    <button onclick="loadPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>下一页</button>
    <button onclick="loadPage(${totalPages - 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>末页</button>
  `;
}

async function selectArticle(id) {
  if (currentView !== 'wechat') return;
  if (selectedArticleId === id) return;
  selectedArticleId = id;
  $$('.art-item').forEach(el => el.classList.toggle('active', +el.dataset.id === id));
  const art = loadedArticles.find(a => a.id === id);
  if (art?.has_content) {
    $('#article-url-bar').style.display = '';
    $('#article-url-bar').innerHTML = `<a href="${hAttr(art.url)}" target="_blank">原文链接</a>`;
    $('#article-view').innerHTML = '<div class="article-empty">加载中...</div>';
    const detail = articleCache.get(id) || await fetch(`/api/articles/${id}`).then(resp => resp.json());
    articleCache.set(id, detail);
    if (selectedArticleId !== id) return;
    if (!detail.content) {
      $('#article-view').innerHTML = `<div class="article-empty">该文章尚未抓取内容<br><small><a href="${h(art.url)}" target="_blank">打开原文</a></small></div>`;
      return;
    }
    const frame = $('#article-view iframe');
    if (frame) {
      frame.srcdoc = detail.content;
    } else {
      $('#article-view').innerHTML = `<iframe class="article-frame" srcdoc="${hAttr(detail.content)}"></iframe>`;
    }
  } else {
    const url = art?.url || '#';
    $('#article-url-bar').style.display = '';
    $('#article-url-bar').innerHTML = `<a href="${hAttr(url)}" target="_blank">原文链接</a>`;
    $('#article-view').innerHTML = `<div class="article-empty">${fetchStatusText(art)}<br><small><a href="${hAttr(url)}" target="_blank">打开原文</a></small></div>`;
  }
}

async function retryFetch(event, id) {
  if (currentView !== 'wechat') return;
  event.stopPropagation();
  const btn = event.currentTarget;
  btn.disabled = true;
  btn.textContent = '已加入';
  const resp = await fetch(`/api/articles/${id}/retry-fetch`, { method: 'POST' });
  if (!resp.ok) {
    btn.disabled = false;
    btn.textContent = '加入重试';
    return;
  }
  const result = await resp.json();
  const art = loadedArticles.find(a => a.id === id);
  if (art) {
    art.fetch_status = result.status;
    art.retry_count = result.retry_count;
    art.next_retry_at = result.next_retry_at;
    art.fetch_error = null;
    art.has_content = false;
    art.content_fetched_at = null;
  }
  renderArticleList();
  await loadStats();
  if (selectedArticleId === id) {
    selectedArticleId = null;
    selectArticle(id);
  }
}

switchView('wechat');
</script>
</body>
</html>
