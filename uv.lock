source = { virtual = "." }
dependencies = [
    { name = "dclassql" },
    { name = "fastapi" },
    { name = "filelock" },
    { name = "html-to-markdown" },
    { name = "lxml" },
    { name = "matplotlib" },
    { name = "opencv-python" },
    { name = "uvicorn" },
]

[package.dev-dependencies]
dev = [
    { name = "ipykernel" },
]

[package.metadata]
requires-dist = [
    { name = "dclassql", specifier = ">=0.3.0" },
    { name = "fastapi", specifier = ">=0.136.1" },
    { name = "filelock", specifier = ">=3.29.0" },
    { name = "html-to-markdown", specifier = ">=3.3.2" },
    { name = "lxml", specifier = ">=6.1.0" },
    { name = "matplotlib", specifier = ">=3.10.9" },
    { name = "opencv-python", specifier = ">=4.13.0.92" },
    { name = "uvicorn", specifier = ">=0.46.0" },
]

[package.metadata.requires-dev]
dev = [{ name = "ipykernel", specifier = ">=7.2.0" }]
